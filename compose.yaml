services:
  postgres:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_demo_password
      POSTGRES_DB: qa_lab
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_lab"]
      interval: 2s
      timeout: 3s
      retries: 20
    # No named volume: this is a disposable educational database.
