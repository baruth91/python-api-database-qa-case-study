[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --junitxml=reports/junit.xml"
markers = [
  "api: real HTTP requests with independent committed database verification",
  "database: direct PostgreSQL integration checks and SQL exercises",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
