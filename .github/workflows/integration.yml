name: API and PostgreSQL case checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Requests, SQL and transaction integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: qa_demo_password
          POSTGRES_DB: qa_lab
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U qa_user -d qa_lab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies and Python code
        run: |
          python -m pip check
          python -m ruff check .
          python -m ruff format --check .
      - name: Run real HTTP and PostgreSQL integration checks
        env:
          QA_DATABASE_URL: postgresql://qa_user:qa_demo_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/qa_lab
        run: python -m pytest -v
      - name: Preserve JUnit and failure investigation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: api-postgresql-evidence
          path: reports/
          if-no-files-found: error
          retention-days: 7
